<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #007bff;
        }

        input.valid,
        select.valid {
            border-color: #28a745;
        }

        input.invalid,
        select.invalid {
            border-color: #dc3545;
        }

        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .success {
            color: #28a745;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }

        .gender-options {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .gender-option {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
        }

        .gender-option input {
            width: auto;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-top: 10px;
        }

        .terms input {
            width: auto;
            margin-top: 3px;
        }

        .terms label {
            font-weight: normal;
            margin: 0;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .password-info {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Registration</h2>

    <div id="successMessage" class="success">
        Registration successful!
    </div>

    <form id="registrationForm" novalidate>

        <!-- NAME -->
        <div class="form-group">

            <label for="name">Full Name *</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                autocomplete="name"
            >

            <div id="nameError" class="error"></div>

        </div>

        <!-- EMAIL -->
        <div class="form-group">

            <label for="email">Email *</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@gmail.com"
                autocomplete="email"
            >

            <div id="emailError" class="error"></div>

        </div>

        <!-- MOBILE -->
        <div class="form-group">

            <label for="mobile">Indian Mobile Number *</label>

            <input
                type="tel"
                id="mobile"
                name="mobile"
                placeholder="10 digit mobile number"
                maxlength="10"
                inputmode="numeric"
                autocomplete="tel"
            >

            <div id="mobileError" class="error"></div>

        </div>

        <!-- PASSWORD -->
        <div class="form-group">

            <label for="password">Password *</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="new-password"
            >

            <div class="password-info">
                Minimum 8 characters, including uppercase, lowercase,
                number and special character.
            </div>

            <div id="passwordError" class="error"></div>

        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="form-group">

            <label for="confirmPassword">Confirm Password *</label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Re-enter password"
                autocomplete="new-password"
            >

            <div id="confirmPasswordError" class="error"></div>

        </div>

        <!-- COURSE -->
        <div class="form-group">

            <label for="course">Course *</label>

            <select id="course" name="course">

                <option value="">-- Select Course --</option>

                <option value="BCA">BCA</option>
                <option value="BBA">BBA</option>
                <option value="BSc">B.Sc</option>
                <option value="BCom">B.Com</option>
                <option value="BA">B.A</option>

            </select>

            <div id="courseError" class="error"></div>

        </div>

        <!-- YEAR -->
        <div class="form-group">

            <label for="year">Year *</label>

            <select id="year" name="year">

                <option value="">-- Select Year --</option>

                <option value="1">First Year</option>
                <option value="2">Second Year</option>
                <option value="3">Third Year</option>
                <option value="4">Fourth Year</option>

            </select>

            <div id="yearError" class="error"></div>

        </div>

        <!-- GENDER -->
        <div class="form-group">

            <label>Gender *</label>

            <div class="gender-options">

                <label class="gender-option">
                    <input type="radio" name="gender" value="Male">
                    Male
                </label>

                <label class="gender-option">
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>

                <label class="gender-option">
                    <input type="radio" name="gender" value="Other">
                    Other
                </label>

            </div>

            <div id="genderError" class="error"></div>

        </div>

        <!-- TERMS -->
        <div class="form-group">

            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                >

                <label for="terms">
                    I agree to the Terms and Conditions *
                </label>

            </div>

            <div id="termsError" class="error"></div>

        </div>

        <!-- SUBMIT -->
        <button type="submit">
            Register
        </button>

    </form>

</div>


<script>

const form = document.getElementById("registrationForm");

// Get elements
const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const mobileInput = document.getElementById("mobile");
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");
const courseInput = document.getElementById("course");
const yearInput = document.getElementById("year");
const termsInput = document.getElementById("terms");

// Error elements
const nameError = document.getElementById("nameError");
const emailError = document.getElementById("emailError");
const mobileError = document.getElementById("mobileError");
const passwordError = document.getElementById("passwordError");
const confirmPasswordError = document.getElementById("confirmPasswordError");
const courseError = document.getElementById("courseError");
const yearError = document.getElementById("yearError");
const genderError = document.getElementById("genderError");
const termsError = document.getElementById("termsError");

// --------------------------------------------------Helper Functions--------------------------------------------------
function showError(input, errorElement, message) {

    input.classList.add("invalid");
    input.classList.remove("valid");

    errorElement.textContent = message;
    errorElement.style.display = "block";
}

function showSuccess(input, errorElement) {

    input.classList.remove("invalid");
    input.classList.add("valid");

    errorElement.textContent = "";
    errorElement.style.display = "none";
}

function clearValidation(input, errorElement) {

    input.classList.remove("invalid", "valid");

    errorElement.textContent = "";
    errorElement.style.display = "none";
}

// --------------------------------------------------NAME VALIDATION--------------------------------------------------
function validateName() {

    const name = nameInput.value.trim();

    if (name === "") {
        showError(
            nameInput,
            nameError,
            "Name is required."
        );
        return false;
    }

    // Allows letters, spaces, apostrophes and hyphens
    const namePattern = /^[A-Za-z]+(?:[ '-][A-Za-z]+)*$/;


    if (!namePattern.test(name)) {
        showError(
            nameInput,
            nameError,
            "Name can contain only letters, spaces, apostrophes or hyphens."
        );
        return false;
    }

    // Minimum 2 characters
    if (name.replace(/[^A-Za-z]/g, "").length < 2) {
        showError(
            nameInput,
            nameError,
            "Please enter a valid name."
        );
        return false;
    }
    showSuccess(nameInput, nameError);
    return true;
}

// --------------------------------------------------EMAIL VALIDATION --------------------------------------------------
function validateEmail() {

    const email = emailInput.value.trim();


    if (email === "") {
        showError(
            emailInput,
            emailError,
            "Email is required."
        );
        return false;
    }

    // Basic email format validation
    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

    if (!emailPattern.test(email)) {
        showError(
            emailInput,
            emailError,
            "Please enter a valid email address."
        );
        return false;
    }
    showSuccess(emailInput, emailError);
    return true;
}

// -------------------------------------------------- MOBILE VALIDATION--------------------------------------------------
function validateMobile() {

    const mobile = mobileInput.value.trim();


    if (mobile === "") {
        showError(
            mobileInput,
            mobileError,
            "Mobile number is required."
        );
        return false;
    }

    // Must contain exactly 10 digits
    if (!/^\d{10}$/.test(mobile)) {
        showError(
            mobileInput,
            mobileError,
            "Mobile number must contain exactly 10 digits."
        );
        return false;
    }

    // Indian mobile numbers normally start with 6, 7, 8 or 9
    if (!/^[6-9]/.test(mobile)) {
        showError(
            mobileInput,
            mobileError,
            "Please enter a valid Indian mobile number."
        );
        return false;
    }

    showSuccess(mobileInput, mobileError);

    return true;
}

// --------------------------------------------------PASSWORD VALIDATION--------------------------------------------------
function validatePassword() {

    const password = passwordInput.value;

    if (password === "") {
        showError(
            passwordInput,
            passwordError,
            "Password is required."
        );
        return false;
    }

    if (password.length < 8) {
        showError(
            passwordInput,
            passwordError,
            "Password must be at least 8 characters long."
        );
        return false;
    }

    if (!/[A-Z]/.test(password)) {
        showError(
            passwordInput,
            passwordError,
            "Password must contain at least one uppercase letter."
        );
        return false;
    }

    if (!/[a-z]/.test(password)) {
        showError(
            passwordInput,
            passwordError,
            "Password must contain at least one lowercase letter."
        );
        return false;
    }

    if (!/[0-9]/.test(password)) {
        showError(
            passwordInput,
            passwordError,
            "Password must contain at least one number."
        );
        return false;
    }

    if (!/[!@#$%^&*(),.?":{}|<>_\-\\[\]\/+=;'`~]/.test(password)) {
        showError(
            passwordInput,
            passwordError,
            "Password must contain at least one special character."
        );
        return false;
    }

    showSuccess(passwordInput, passwordError);

    return true;
}

// --------------------------------------------------CONFIRM PASSWORD VALIDATION--------------------------------------------------
function validateConfirmPassword() {

    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;


    if (confirmPassword === "") {
        showError(
            confirmPasswordInput,
            confirmPasswordError,
            "Please confirm your password."
        );
        return false;
    }

    if (password !== confirmPassword) {
        showError(
            confirmPasswordInput,
            confirmPasswordError,
            "Passwords do not match."
        );
        return false;
    }

    showSuccess(
        confirmPasswordInput,
        confirmPasswordError
    );

    return true;
}

// --------------------------------------------------COURSE VALIDATION--------------------------------------------------
function validateCourse() {

    if (courseInput.value === "") {
        showError(
            courseInput,
            courseError,
            "Please select a course."
        );
        return false;
    }

    showSuccess(courseInput, courseError);

    return true;
}

// --------------------------------------------------YEAR VALIDATION --------------------------------------------------
function validateYear() {

    if (yearInput.value === "") {
        showError(
            yearInput,
            yearError,
            "Please select your year."
        );
        return false;
    }

    showSuccess(yearInput, yearError);

    return true;
}

// --------------------------------------------------GENDER VALIDATION --------------------------------------------------
function validateGender() {

    const selectedGender =
        document.querySelector('input[name="gender"]:checked');

    if (!selectedGender) {
        genderError.textContent =
            "Please select your gender.";

        genderError.style.display = "block";
        return false;
    }

    genderError.textContent = "";
    genderError.style.display = "none";

    return true;
}

// --------------------------------------------------TERMS VALIDATION--------------------------------------------------
function validateTerms() {

    if (!termsInput.checked) {
        termsError.textContent =
            "You must agree to the Terms and Conditions.";
        termsError.style.display = "block";
        return false;
    }

    termsError.textContent = "";
    termsError.style.display = "none";

    return true;
}

// -------------------------------------------------- REMOVE NON-DIGITS FROM MOBILE INPUT --------------------------------------------------
mobileInput.addEventListener("input", function () {

    this.value = this.value.replace(/\D/g, "");

});

// --------------------------------------------------REAL-TIME VALIDATION--------------------------------------------------

nameInput.addEventListener("blur", validateName);

emailInput.addEventListener("blur", validateEmail);

mobileInput.addEventListener("blur", validateMobile);

passwordInput.addEventListener("blur", validatePassword);

confirmPasswordInput.addEventListener(
    "blur",
    validateConfirmPassword
);

courseInput.addEventListener("change", validateCourse);

yearInput.addEventListener("change", validateYear);

termsInput.addEventListener("change", validateTerms);

document.querySelectorAll('input[name="gender"]')
    .forEach(function (radio) {

        radio.addEventListener("change", validateGender);

    });

// --------------------------------------------------FORM SUBMISSION --------------------------------------------------

form.addEventListener("submit", function(event) {

    event.preventDefault();


    // Validate EVERYTHING
    const nameValid = validateName();

    const emailValid = validateEmail();

    const mobileValid = validateMobile();

    const passwordValid = validatePassword();

    const confirmPasswordValid =
        validateConfirmPassword();

    const courseValid = validateCourse();

    const yearValid = validateYear();

    const genderValid = validateGender();

    const termsValid = validateTerms();

    // Check if every condition is valid
    if (
        nameValid &&
        emailValid &&
        mobileValid &&
        passwordValid &&
        confirmPasswordValid &&
        courseValid &&
        yearValid &&
        genderValid &&
        termsValid
    ) {

        document.getElementById("successMessage")
            .style.display = "block";

        alert("Registration successful!");

        // In a real application, submit the data
        // to your backend here.

        // form.submit();

    } else {

        document.getElementById("successMessage")
            .style.display = "none";

        // Scroll to first invalid field
        const firstInvalid =
            document.querySelector(".invalid");

        if (firstInvalid) {

            firstInvalid.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

            firstInvalid.focus();
        }
    }

});

</script>

</body>
</html>
