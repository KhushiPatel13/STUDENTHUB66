<!DOCTYPE html>
<html>
<body>

<form>
    <label for="rollno">Roll Number:</label>
  <input type="text"
       id="rollno"
       name="rollno"
       placeholder="enter id"
       pattern="([dD])?[0-9]{2}([dD])?[cC][sS][0-9]{3}"
       title="Enter roll number in format 25CS066, 25DCS066 or D25CS066"
       required>

    <button type="submit">Submit</button>
</form>

</body>
</html>
